[cuda]
packages = ["torch-scatter"]


[pypi-dependencies]
# Installation dependencies
requests = ">=2.25.0"
tqdm = ">=4.60.0"

# Core mesh processing
trimesh = ">=3.15.0"
numpy = ">=1.21.0"
scipy = ">=1.7.0"
libigl = ">=2.4.0"
comfy-aimdo = "*"
pyvista = "*"
# Required by comfy_api.latest (V3 node API) used by the geometry-segmentation nodes
av = "*"

# Image processing
pillow = ">=9.0.0"
opencv-python = ">=4.5.0"

# Deep learning
huggingface-hub = ">=0.20.0"
transformers = ">=4.30.0"

# SAM2
iopath = ">=0.1.10"

# SAM3
timm = ">=1.0.17"
safetensors = ">=0.4.0"
ftfy = ">=6.1.1"
regex = "*"
einops = ">=0.6.0"
pycocotools = ">=2.0.6"
scikit-image = ">=0.19.0"

# Configuration
omegaconf = ">=2.3.0"
hydra-core = ">=1.3.0"

# Rendering
pyrender = ">=0.1.45"
PyOpenGL = ">=3.1.0"
PyOpenGL-accelerate = ">=3.1.0"

# Graph algorithms
networkx = ">=2.6.0"
python-igraph = ">=0.10.0"
PyMaxflow = ">=1.2.0"

# SAMesh
natsort = ">=8.0.0"
torchtyping = ">=0.1.0"
matplotlib = ">=3.5.0"
pymeshlab = ">=2022.2"

# PartField
yacs = ">=0.1.8"
lightning = ">=2.0.0"
scikit-learn = ">=1.0.0"
boto3 = "*"
loguru = "*"
psutil = "*"
plyfile = "*"